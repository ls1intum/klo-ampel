# Local Keycloak for development. Run the app itself with `go run .` (see README).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm --http-port 8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./dev/realm.json:/opt/keycloak/data/import/realm.json:ro
