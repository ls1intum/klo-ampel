apiVersion: v1
kind: Service
metadata:
  name: {{ include "klo-ampel.fullname" . }}
  labels:
    {{- include "klo-ampel.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "klo-ampel.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
