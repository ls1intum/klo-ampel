{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "klo-ampel.fullname" . }}
  labels:
    {{- include "klo-ampel.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "klo-ampel.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.requestTimeout }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
{{- end }}
