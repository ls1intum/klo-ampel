{{- if not .Values.oidc.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "klo-ampel.fullname" . }}
  labels:
    {{- include "klo-ampel.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "oidc.clientSecret or oidc.existingSecret is required" .Values.oidc.clientSecret | quote }}
{{- end }}
